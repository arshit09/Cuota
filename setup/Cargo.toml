[package]
name = "cuota-setup"
version = "0.1.0"
edition = "2024"
description = "Installs Cuota for the signed-in user"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["glow"] }
gif = { version = "0.14", default-features = false, features = ["std"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
